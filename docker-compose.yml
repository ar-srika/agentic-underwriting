version: "3.8"

services:
  underwrite-ai-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: underwrite-ai-backend
    command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - DATA_SOVEREIGNTY_REGION=us-central1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - enterprise-net

networks:
  enterprise-net:
    driver: bridge

